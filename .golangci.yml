# golangci-lint
version: "2"

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  # govet:
  govet:
    enable-all: true
    disable:
      - shadow
      - fieldalignment

  # revive
  revive:
    confidence: 0.8
    enable-all-rules: false
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: if-return
      - name: increment-decrement
      - name: var-declaration
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unreachable-code
      - name: redefines-builtin-id

  # gocritic
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - whyNoLint
      - hugeParam

  # staticcheck
  staticcheck:
    checks: ["all"]

  # unused
  unused:
    check-exported: false

  # gosec
  gosec:
    excludes:
      - G104
    config:
      # G306
      G306: "0644"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck

    - ineffassign
    - unused

    - gocritic

    - gosec

    - misspell
    - nakedret
    - prealloc

    # Go module
    - gomoddirectives

  disable:
    - exhaustive
    - gochecknoglobals
    - gochecknoinits
    - cyclop
    - funlen
    - gocognit
    - lll

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - gocritic

    # Code generation tools - G304 is expected for file operations
    - path: cmd/converter/
      text: "G304"

    - path: cmd/servicegen/
      text: "G304"

    - path: \.pb\.go$
      linters:
        - all

    - path: _gen\.go$
      linters:
        - all

    - path: generated/
      linters:
        - all

    - path: wire_gen\.go$
      linters:
        - all

    - path: wire_gen\.go$
      linters:
        - gocyclo
        - gocognit
        - funlen

    - path: \.pb\.go$
      linters:
        - lll

  exclude-dirs:
    - bin
    - _docs
    - third_party
    - vendor

  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*_gen\\.go$"
    - "wire_gen\\.go$"

  max-same-issues: 0

  max-issues-per-linter: 0

  uniq-by-line: true

run:
  timeout: 5m

  tests: false

  modules-download-mode: readonly

output:
  print-issued-lines: true

  print-linter-name: true

  sort-results: true
